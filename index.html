<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>W&W · Ticket Follow-up</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Minimalist Modern tokens (old var names kept so the JS keeps working) */
:root{--bg:#FAFAFA;--card:#fff;--tx:#0F172A;--mu:#64748B;--bd:#E2E8F0;--muted:#F1F5F9;--ac:#0052FF;--ac2:#4D7CFF;--ok:#16a34a;--err:#ef4444;
  --grad:linear-gradient(135deg,#0052FF,#4D7CFF);--sh-sm:0 1px 3px rgba(0,0,0,.06);--sh-md:0 4px 6px rgba(0,0,0,.07);--sh-xl:0 20px 25px rgba(0,0,0,.1);
  --sh-ac:0 4px 14px rgba(0,82,255,.25);--sh-ac-lg:0 8px 24px rgba(0,82,255,.35);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:14px/1.6 Inter,"Noto Sans Thai",system-ui,sans-serif;color:var(--tx);background:#0F172A radial-gradient(circle,rgba(255,255,255,.06) 1px,transparent 1px) 0 0/32px 32px fixed;padding:32px 20px 64px;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;top:-180px;right:-140px;width:520px;height:520px;border-radius:50%;background:rgba(0,82,255,.28);filter:blur(150px);pointer-events:none}
.wrap{max-width:1080px;margin:auto;position:relative}
h1{font:700 clamp(2rem,5vw,3rem)/1.15 Inter,"Noto Sans Thai",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:-.02em;margin:0 0 16px;color:#fff}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:var(--sh-md)}
label{display:block;font:500 11px "JetBrains Mono",monospace;color:var(--mu);margin-bottom:6px;letter-spacing:.08em;text-transform:uppercase}
input[type=text],textarea,select{width:100%;min-height:44px;padding:9px 14px;border:1px solid var(--bd);border-radius:12px;background:#fff;color:var(--tx);font:inherit;outline:none;transition:all .2s ease-out}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ac)}
input::placeholder,textarea::placeholder{color:rgba(100,116,139,.5)}
input[type=checkbox]{accent-color:var(--ac);width:16px;height:16px;vertical-align:-3px}
textarea{min-height:64px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.row>div{flex:1;min-width:180px}
button{min-height:44px;padding:0 20px;border:1px solid transparent;border-radius:12px;background:var(--grad);color:#fff;font:500 14px Inter,"Noto Sans Thai",sans-serif;cursor:pointer;box-shadow:var(--sh-sm);transition:all .2s ease-out}
button:hover{transform:translateY(-2px);box-shadow:var(--sh-ac-lg);filter:brightness(1.1)}
button:active{transform:scale(.98)}
button:focus-visible{outline:none;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ac)}
button.sec{background:transparent;color:var(--tx);border-color:var(--bd);box-shadow:none;filter:none}
button.sec:hover{background:var(--muted);border-color:rgba(0,82,255,.3);box-shadow:var(--sh-md)}
button.done,button.sec.done{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 4px 14px rgba(22,163,74,.3)}
.pill{display:inline-flex;align-items:center;gap:10px;margin-bottom:16px;padding:6px 14px;border:1px solid rgba(0,82,255,.3);border-radius:999px;background:rgba(0,82,255,.05);color:var(--ac);font:500 11px "JetBrains Mono",monospace;letter-spacing:.15em;text-transform:uppercase}
.pill i,.sync i{width:8px;height:8px;border-radius:50%;background:var(--ac);flex:none;animation:pl 2s ease-in-out infinite}
.sync{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 20px;padding:8px 16px;border:1px solid var(--bd);border-radius:999px;background:#fff;box-shadow:var(--sh-sm);font-size:13px;cursor:pointer;user-select:none;transition:all .2s ease-out}
.sync:hover{border-color:rgba(0,82,255,.3);box-shadow:var(--sh-md);transform:translateY(-1px)}
.sync i{width:10px;height:10px;background:var(--mu);animation:none}
.sync.ok i{background:var(--ok);box-shadow:0 0 0 4px rgba(22,163,74,.15);animation:pl 3s ease-in-out infinite}
.sync.busy i{background:var(--ac);box-shadow:0 0 0 4px rgba(0,82,255,.15);animation:pl 1s ease-in-out infinite}
.sync.err i{background:var(--err);box-shadow:0 0 0 4px rgba(239,68,68,.15)}
.sync b{font-weight:600}
.site{border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;overflow:hidden;background:#fff;box-shadow:var(--sh-md);transition:all .3s ease-out}
.site:hover{box-shadow:var(--sh-xl);transform:translateY(-2px)}
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(135deg,rgba(0,82,255,.05),transparent);border-bottom:1px solid var(--bd)}
.sh b{font-size:15px;font-weight:600;letter-spacing:-.01em}
.sh button{min-height:36px;padding:0 14px;font-size:13px;border-radius:10px}
.t{padding:8px 14px;border-top:1px solid var(--muted);display:flex;gap:12px;font-size:13px}
.t:first-of-type{border-top:0}
.t code{white-space:nowrap;color:var(--ac);font:500 12.5px "JetBrains Mono",monospace}
.t span{color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mu{color:var(--mu);font-size:12px}
.who{font:500 12px "JetBrains Mono",monospace;font-style:normal;color:var(--ac);background:rgba(0,82,255,.07);border-radius:6px;padding:1px 8px;white-space:nowrap}
.bar{align-items:center}
#count{color:var(--tx);font-size:18px;font-weight:600;letter-spacing:-.01em}
#msg{margin-top:8px}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:#0F172A}::-webkit-scrollbar-thumb{background:#334155;border-radius:8px}
.pvbtn{width:100%;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 14px;background:#fff;color:var(--tx);border:1px solid var(--bd);border-radius:12px;box-shadow:none;font:400 14px Inter,"Noto Sans Thai",sans-serif;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pvbtn::after{content:"\25BE";color:var(--mu);flex:none}
.pvbtn:hover{background:#fff;box-shadow:none;transform:none;filter:none}
.pvbox{position:absolute;z-index:30;top:calc(100% + 4px);left:0;min-width:100%;width:max-content;max-width:320px;max-height:320px;overflow:auto;padding:6px;border:1px solid var(--bd);border-radius:12px;background:#fff;box-shadow:var(--sh-xl)}
.pvbox[hidden]{display:none}
.pvbox label{display:flex;align-items:center;gap:8px;margin:0;padding:6px 8px;border-radius:8px;font:400 13px Inter,"Noto Sans Thai",sans-serif;color:var(--tx);text-transform:none;letter-spacing:0;cursor:pointer;white-space:nowrap}
.pvbox label:hover{background:var(--muted)}
.pvbox .mu{font-size:11px;margin-left:auto}
.pvbox .pvhd{padding:6px 8px;font-size:12px;color:var(--ac);cursor:pointer;border-bottom:1px solid var(--bd);margin-bottom:4px}
.pvbox .pvsep{height:1px;background:var(--bd);margin:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.cl{font:500 11px "JetBrains Mono",monospace;color:var(--mu);letter-spacing:.08em;text-transform:uppercase;margin:4px 0 8px}
button.chip{min-height:36px;padding:0 6px 0 14px;border-radius:999px;background:#fff;color:var(--tx);border:1px solid var(--bd);box-shadow:none;font-size:13px;display:inline-flex;align-items:center;gap:8px}
button.chip:hover{transform:none;filter:none;background:var(--muted);border-color:rgba(0,82,255,.3);box-shadow:none}
button.chip span{min-width:24px;padding:1px 8px;border-radius:999px;background:var(--muted);color:var(--mu);font:500 11px "JetBrains Mono",monospace;text-align:center}
button.chip.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:var(--sh-ac)}
button.chip.on span{background:rgba(255,255,255,.25);color:#fff}
.t{flex-wrap:wrap;align-items:center}
.t .sj{flex:1 1 260px;color:var(--mu);white-space:normal;overflow:visible}
.t .sv{font:600 11px "JetBrains Mono",monospace;padding:1px 8px;border-radius:6px;background:var(--muted);color:var(--tx)}
.t .ss{font:600 12.5px "JetBrains Mono",monospace;color:var(--tx)}
.st{font:600 11.5px "JetBrains Mono",monospace;font-style:normal;border-radius:6px;padding:1px 8px;white-space:nowrap}
.st.ok{color:#15803d;background:rgba(22,163,74,.1)}
.st.over{color:#b91c1c;background:rgba(239,68,68,.1)}
.reg{--rc:#0052FF;--rcb:0,82,255}
.sh.rh{border-radius:10px;margin:14px 0 8px;border:1px solid rgba(var(--rcb),.25);border-left:6px solid var(--rc);background:rgba(var(--rcb),.10)}
.sh.rh b{color:var(--rc);font-size:16px}
.sh.rh button{background:var(--rc);box-shadow:0 4px 14px rgba(var(--rcb),.3)}
.reg .site{border-left:4px solid var(--rc)}
.reg .site .sh{background:linear-gradient(135deg,rgba(var(--rcb),.07),transparent)}
.reg .t code{color:var(--rc)}
.reg .who{color:var(--rc);background:rgba(var(--rcb),.08)}
@keyframes pl{50%{transform:scale(1.3);opacity:.7}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:600px){.t{flex-wrap:wrap;gap:4px}.t span{white-space:normal}}
</style>
</head>
<body>
<div class="wrap">
<h1>W&W · Ticket <span class="gt">Follow-up</span></h1>
<div id="sync" class="sync" title="คลิกเพื่อ Sync ตอนนี้"><i></i><span><b>ยังไม่ได้ Sync</b></span></div>

<div class="card" style="display:none">
  <div class="row">
    <div style="flex:3"><label>ลิงก์ Google Sheet</label><input type="text" id="url" value="https://docs.google.com/spreadsheets/d/1TtEps-4CwrDe3P77LN_XEikTvO89DLdOenxL3fb0mZ4/edit?gid=338097387#gid=338097387"></div>
    <div style="flex:0;min-width:auto"><button id="load">โหลดข้อมูล</button></div>
    <div style="flex:0;min-width:auto"><button class="sec" onclick="file.click()">อัปโหลด CSV</button><input type="file" id="file" accept=".csv" hidden></div>
  </div>
  <div class="row" style="margin-top:10px;align-items:center">
    <div style="flex:0;min-width:auto"><button class="sec" id="refresh">รีเฟรชข้อมูล</button></div>
    <div style="flex:0;min-width:auto;white-space:nowrap"><label style="display:inline;color:var(--tx);text-transform:none"><input type="checkbox" id="auto" checked> รีเฟรชอัตโนมัติทุก 5 นาที</label></div>
    <div id="upd" style="flex:2" class="mu">ยังไม่มีข้อมูล</div>
  </div>
  <div class="mu" id="msg">ชีตต้องแชร์เป็น "ทุกคนที่มีลิงก์ดูได้" ถ้าโหลดไม่ได้ ให้ดาวน์โหลดเป็น CSV แล้วอัปโหลดแทน</div>
</div>

<div class="card" style="display:none">
  <label>วิธีสำรอง: ในชีตกด Ctrl+A → Ctrl+C แล้ววางที่นี่ (ต้องรวมแถวหัวคอลัมน์)</label>
  <textarea id="paste" placeholder="วางข้อมูลจากชีตที่นี่"></textarea>
  <div style="margin-top:6px"><button class="sec" id="usepaste">ใช้ข้อมูลที่วาง</button></div>
</div>

<div class="card">
  <div class="pill"><i></i>Filters</div>
  <div class="row">
    <div style="flex:1"><label>Escalate type</label>
      <select id="kw"><option value="all">ทั้งหมด</option><option value="power">ระบบไฟ</option><option value="ofc">OFC</option></select></div>
    <div><label>Site</label><input type="text" id="sitef" placeholder="ค้นหา Site เช่น NKN"></div>
    <div><label>Severity</label>
      <select id="sev"><option value="all">ทั้งหมด (NSA + SA)</option><option value="NSA">NSA</option><option value="SA">SA</option></select></div>
    <div><label>Region</label><select id="rg"><option value="">ทั้งหมด</option><option>BMA</option><option>CW</option><option>East</option><option>South</option><option>อื่นๆ</option></select></div>
    <div id="pvwrap" style="position:relative"><label>Province</label><button type="button" class="pvbtn" id="pvbtn">ทั้งหมด</button><div id="pv" class="pvbox" hidden></div></div>
    <div style="flex:0;min-width:auto;white-space:nowrap"><label>&nbsp;</label><label style="display:inline;color:var(--tx)"><input type="checkbox" id="onlylist" checked> เฉพาะ Site ในรายการ</label></div>
  </div>
</div>

<details class="card" id="tgcard" style="display:none"><!-- ซ่อนไว้ก่อน: ลบ style="display:none" เพื่อแสดงการ์ด Telegram -->
  <summary class="pill" style="cursor:pointer;list-style:none;margin:0">Telegram · ส่งอัตโนมัติ</summary>
  <div class="row" style="margin-top:16px">
    <div style="flex:2"><label>Bot token</label><input type="password" id="tgtok" placeholder="123456:ABC..." autocomplete="off"></div>
    <div><label>Chat ID</label><input type="text" id="tgchat" placeholder="-100..." autocomplete="off"></div>
    <div style="flex:0;min-width:auto"><button type="button" class="sec" id="tgtest">ทดสอบส่ง</button></div>
    <div style="flex:0;min-width:auto"><button type="button" class="sec" id="tgnow">ส่งตามตัวกรองตอนนี้</button></div>
  </div>
  <div style="margin-top:14px;display:flex;gap:12px;flex-wrap:wrap;align-items:center">
    <label style="display:inline;margin:0;text-transform:none;letter-spacing:0;font:400 14px Inter,'Noto Sans Thai',sans-serif;color:var(--tx)"><input type="checkbox" id="tgauto"> ส่งอัตโนมัติ (ตามตัวกรองที่เลือกอยู่)</label>
    <select id="tgmode" style="width:auto;min-width:240px"><option value="hourly">ทุกชั่วโมง (รายการทั้งหมดตามตัวกรอง)</option><option value="new">เมื่อมี Ticket ใหม่</option></select>
    <span class="mu" id="tgst"></span>
  </div>
  <div class="mu" style="margin-top:8px">ต้องเปิดหน้านี้ค้างไว้ · token เก็บในเบราว์เซอร์เครื่องนี้เท่านั้น ไม่ได้อยู่ในไฟล์</div>
</details>
<div class="card">
  <div class="row bar">
    <div><b id="count">ยังไม่มีข้อมูล</b></div>
    <div style="flex:0;min-width:auto;white-space:nowrap">
      <button id="copyall">Copy ตามตัวกรอง</button>
    </div>
  </div>
  <div id="list" style="margin-top:10px"></div>
</div>
</div>

function setSync(state,title,detail){
  const el=document.getElementById("sync");
  el.className="sync "+state;
  el.innerHTML=`<i></i><span><b>${title}</b>${detail?` <span class="mu">· ${detail}</span>`:""}</span>`;
}
const h53=str=>{let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)};
/* detect real data changes anywhere in the sheet: fingerprint of the whole table, kept in localStorage */
function track(src,tbl){
  const sig=h53(JSON.stringify(tbl.map(r=>{const a=r.map(c=>String(c).trim());while(a.length&&!a[a.length-1])a.pop();return a})));
  const key="ww_sync:"+src;let prev=null;
  try{prev=JSON.parse(localStorage.getItem(key)||"null")}catch(e){}
  const st=(prev&&prev.sig===sig)?{sig,at:prev.at,first:!!prev.first,changed:false}:{sig,at:Date.now(),first:!prev,changed:!!prev};
  try{localStorage.setItem(key,JSON.stringify({sig:st.sig,at:st.at,first:st.first}))}catch(e){}
  return st;
}
function setUpd(src,st){
  const n=new Date();
  const t=n.toLocaleTimeString("th-TH",{hour12:false});
  const d=n.toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"numeric"});
  $("upd").innerHTML=`<span style="color:var(--ok)">●</span> อัปเดตข้อมูลล่าสุดเมื่อ <b style="color:var(--tx)">${t}</b> · ${d} · จาก ${src}`;
  lastOk=`${t} · ${d}`;
  const ca=new Date(st.at),fmtT=ca.toLocaleTimeString("th-TH",{hour12:false}),fmtD=ca.toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"numeric"});
  setSync("ok",st.changed?"ข้อมูลมีการอัปเดต ✓":"Sync แล้ว ✓",`ข้อมูลอัปเดตล่าสุด <b>${fmtT}</b> · ${fmtD}${st.first?" (ตรวจพบครั้งแรก)":""} · ตรวจสอบล่าสุด ${t} · จาก ${src}`);
}

function parseCSV(t,d=","){

    else if(ch=='"') q=true;

  if(!m)return null;
  let a=+m[1],b=+m[2],c=+m[3],y,mo,d;
  if(m[1].length===4){y=a;mo=b;d=c}else{y=c;if(b>12&&a<=12){mo=a;d=b}else{d=a;mo=b}}
  if(y<100)y+=2000;if(y>2400)y-=543;

      const d=document.createElement("div");d.className="site";
      d.innerHTML=`<div class="sh"><b>${esc(pv)} <span class="mu">${l.length}${overN(l)?` · Over ${overN(l)}`:""}</span></b><button class="sec">Copy</button></div>`+
        l.map(x=>{const z=slaOf(x);return `<div class="t"><code>${esc(x.id)}</code>${x.sev?`<span class="sv">${esc(x.sev)}</span>`:""}<b class="ss">${esc(siteLabel(x))}</b>${x.holder?`<em class="who">${esc(x.holder)}</em>`:""}${z?`<em class="st ${z.over?"over":"ok"}">${z.txt}</em>`:""}<span class="sj">${esc(x.subj)}</span></div>`}).join("");
      d.querySelector("button").onclick=e=>copy(text(l),e.target);
      sec.appendChild(d);
    });
    $("list").appendChild(sec);
  });
}

async function copy(txt,btn){
  try{await navigator.clipboard.writeText(txt)}
  catch{const a=document.createElement("textarea");a.value=txt;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}
  const o=btn.textContent;btn.textContent="คัดลอกแล้ว";btn.classList.add("done");
  setTimeout(()=>{btn.textContent=o;btn.classList.remove("done")},1200);
}

/* ---- Telegram auto-send: runs inside this page (tab must stay open) ---- */
const TGK="ww_tg",TGS="ww_tg_sent",TGF="ww_tg_fs",TGH="ww_tg_hr";
let tgPending=false,tgTried="";
const tgHourKey=()=>{const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()+"-"+d.getHours()};
/* every 30 s: when the hour changes, refresh the sheet then send the filtered list (flag consumed in tgAuto) */
function tgTick(){
  const c=tgGet();if(!c.auto||(c.mode||"hourly")!=="hourly")return;
  const k=tgHourKey();if(k===localStorage.getItem(TGH)||k===tgTried)return;
  tgTried=k;tgPending=true;$("load").click();
}
setInterval(tgTick,30000);
const tgGet=()=>{try{return JSON.parse(localStorage.getItem(TGK)||"{}")}catch(e){return{}}};
const tgSave=()=>{try{localStorage.setItem(TGK,JSON.stringify({token:$("tgtok").value.trim(),chat:$("tgchat").value.trim(),auto:$("tgauto").checked,mode:$("tgmode").value}))}catch(e){}};
const tgNow=()=>new Date().toLocaleTimeString("th-TH",{hour12:false});
const tgSt=(m,bad)=>{$("tgst").textContent=m;$("tgst").style.color=bad?"var(--err)":""};
function tgSplit(txt,lim=3500){
  const out=[];let cur="";
  const push=p=>{if(cur&&(cur+"\n\n"+p).length>lim){out.push(cur);cur=p}else cur=cur?cur+"\n\n"+p:p};
  txt.split("\n\n").forEach(piece=>{
    if(piece.length<=lim){push(piece);return}
    const L=piece.split("\n"),head=L[0];let buf="";
    L.forEach(l=>{if(buf&&(buf+"\n"+l).length>lim){push(buf);buf=head+" (ต่อ)\n"+l}else buf=buf?buf+"\n"+l:l});
    if(buf)push(buf);
  });
  if(cur)out.push(cur);return out;
}
async function tgSendRaw(t){
  const c=tgGet();if(!c.token||!c.chat)throw new Error("ยังไม่ได้ใส่ Bot token / Chat ID");
  const html=t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*([^*\n]+)\*/g,"<b>$1</b>");
  const r=await fetch(`https://api.telegram.org/bot${c.token}/sendMessage`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:c.chat,text:html,parse_mode:"HTML",disable_web_page_preview:true})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.ok)throw new Error(j.description||("HTTP "+r.status));
}
const tgSend=async t=>{for(const p of tgSplit(t))await tgSendRaw(p)};
const tgFs=()=>JSON.stringify([kwMode,[...sevSet].sort(),$("rg").value,[...pvSet].sort(),$("sitef").value.trim(),$("onlylist").checked]);
async function tgAuto(src){
  const cfg=tgGet();if(!cfg.auto||src!=="Google Sheet")return;
  if((cfg.mode||"hourly")==="hourly"){
    if(!tgPending)return;
    tgPending=false;const f=filtered();
    try{
      if(f.length){await tgSend(text(f));tgSt(`ส่งรายงานรายชั่วโมง ${f.length} Ticket ${tgNow()}`)}
      else tgSt(`ถึงเวลาส่ง ${tgNow()} แต่ไม่มี Ticket ตามตัวกรอง`);
      try{localStorage.setItem(TGH,tgHourKey())}catch(e){}
    }catch(e){tgPending=true;tgSt("ส่งไม่สำเร็จ (จะลองใหม่รอบถัดไป): "+e.message,true)}
    return;
  }
  const f=filtered(),present=new Set(f.map(x=>x.id)),fs=tgFs(),same=localStorage.getItem(TGF)===fs;
  let sent=[];try{sent=JSON.parse(localStorage.getItem(TGS)||"[]")}catch(e){}
  /* filters changed (or first run): remember what is visible now, send nothing */
  const keep=new Set(same?sent.filter(i=>present.has(i)):[...present]);
  const fresh=same?f.filter(x=>!keep.has(x.id)):[];
  try{
    if(fresh.length){await tgSend(text(fresh));fresh.forEach(x=>keep.add(x.id));tgSt(`ส่ง ${fresh.length} Ticket ใหม่ ${tgNow()}`)}
    else tgSt(same?`ตรวจแล้ว ไม่มี Ticket ใหม่ ${tgNow()}`:"เปิดส่งอัตโนมัติแล้ว (จำ Ticket ที่เห็นตอนนี้ ไม่ส่งซ้ำ)");
  }catch(e){tgSt("ส่งไม่สำเร็จ: "+e.message,true)}
  try{localStorage.setItem(TGS,JSON.stringify([...keep]));localStorage.setItem(TGF,fs)}catch(e){}
}
(()=>{const c=tgGet();$("tgtok").value=c.token||"";$("tgchat").value=c.chat||"";$("tgauto").checked=!!c.auto;$("tgmode").value=c.mode||"hourly"})();
$("tgtok").onchange=$("tgchat").onchange=tgSave;
function tgArm(){
  tgSave();tgPending=false;tgTried="";
  if(!$("tgauto").checked){tgSt("ปิดส่งอัตโนมัติแล้ว");return}
  if($("tgmode").value==="hourly"){try{localStorage.setItem(TGH,tgHourKey())}catch(e){}tgSt(`เปิดแล้ว: จะส่งทุกต้นชั่วโมง (รอบถัดไป ${String((new Date().getHours()+1)%24).padStart(2,"0")}:00)`)}
  else{try{localStorage.removeItem(TGF)}catch(e){}tgAuto("Google Sheet")}
}
$("tgauto").onchange=tgArm;$("tgmode").onchange=tgArm;
if($("tgauto").checked&&$("tgmode").value==="hourly"){try{localStorage.setItem(TGH,tgHourKey())}catch(e){}}   /* page just opened: do not send an immediate catch-up */
$("tgtest").onclick=async()=>{tgSave();try{await tgSendRaw("✅ ทดสอบส่งจาก W&W Ticket Follow-up");tgSt("ส่งทดสอบสำเร็จ "+tgNow())}catch(e){tgSt("ส่งไม่สำเร็จ: "+e.message,true)}};
$("tgnow").onclick=async()=>{tgSave();const f=filtered();if(!f.length){tgSt("ไม่มี Ticket ตามตัวกรอง",true);return}try{await tgSend(text(f));tgSt(`ส่ง ${f.length} Ticket แล้ว ${tgNow()}`)}catch(e){tgSt("ส่งไม่สำเร็จ: "+e.message,true)}};

$("copyall").onclick=e=>copy(text(filtered(),true),e.target);

function viaScript(id,gid){
  return new Promise((res,rej)=>{
    window.google={visualization:{Query:{setResponse:r=>{
      if(!r||!r.table)return rej(new Error("ชีตไม่เปิดสิทธิ์ดู"));
      const cols=r.table.cols.map(c=>c.label||"");
      const data=r.table.rows.map(x=>x.c.map(c=>c?(c.f!=null?c.f:(c.v==null?"":c.v)):""));
      res(cols.some(Boolean)?[cols,...data]:data);
    }}}};
    const sc=document.createElement("script");
    sc.src=`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json${gid?"&gid="+gid:""}&_=${Date.now()}`;
    sc.onerror=()=>rej(new Error("โหลดไม่ได้"));
    document.head.appendChild(sc);
    setTimeout(()=>rej(new Error("หมดเวลา")),15000);
  });
}

$("load").onclick=async()=>{
  const u=$("url").value.trim();
  setSync("busy","กำลัง Sync…","");
  const fail=m=>setSync("err","Sync ไม่สำเร็จ",m+(lastOk?` · สำเร็จล่าสุด ${lastOk}`:""));
  const pm=u.match(/\/d\/e\/([\w-]+)/);
  if(pm){
    $("msg").textContent="กำลังโหลด...";
    try{
      const g=(u.match(/gid=(\d+)/)||[])[1];
      const res=await fetch(`https://docs.google.com/spreadsheets/d/e/${pm[1]}/pub?output=csv${g?"&gid="+g:""}&_=${Date.now()}`,{cache:"no-store"});
      if(!res.ok)throw new Error("HTTP "+res.status);
      ingest(await wsv(res.text()));$("msg").textContent="โหลดสำเร็จ";
    }catch(e){$("msg").textContent="โหลดไม่สำเร็จ: "+e.message+" (ใช้ช่องวางข้อมูลแทนได้)";fail(e.message)}
    return;
  }
  const m=u.match(/\/d\/([\w-]+)/),gid=(u.match(/gid=(\d+)/)||[])[1];
  if(!m){$("msg").textContent="ลิงก์ไม่ถูกต้อง";fail("ลิงก์ไม่ถูกต้อง");return}
  $("msg").textContent="กำลังโหลด...";
  try{
    const res=await fetch(`https://docs.google.com/spreadsheets/d/${m[1]}/gviz/tq?tqx=out:csv${gid?"&gid="+gid:""}&_=${Date.now()}`,{cache:"no-store"});
    if(!res.ok)throw new Error("HTTP "+res.status);
    ingest(await wsv(res.text()));
    $("msg").textContent="โหลดสำเร็จ";
  }catch(e1){
    try{ingest(await wsv(viaScript(m[1],gid)));$("msg").textContent="โหลดสำเร็จ"}
    catch(e2){$("msg").textContent="โหลดอัตโนมัติไม่ได้ (ชีตน่าจะยังไม่เปิดแชร์) ให้ใช้ช่องวางข้อมูลด้านล่างแทน";fail("ชีตอาจยังไม่เปิดแชร์")}
  }
};

$("usepaste").onclick=async()=>{
  try{await ensureSites();ingest($("paste").value,"\t","ข้อมูลที่วาง");$("msg").textContent="ใช้ข้อมูลที่วางแล้ว"}
  catch(err){$("msg").textContent=err.message}
};

$("file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  f.text().then(async t=>{try{await ensureSites();ingest(t,",","ไฟล์ CSV");$("msg").textContent="โหลดจากไฟล์สำเร็จ"}catch(err){$("msg").textContent=err.message}});
};

$("sitef").oninput=render;
$("sev").onchange=e=>{const v=e.target.value,N=["NSA1","NSA2","NSA3"],S=["SA1","SA2","SA3","SA4"];sevSet=new Set(v==="all"?[...N,...S]:v==="NSA"?N:v==="SA"?S:[v]);render()};
$("kw").onchange=e=>{kwMode=e.target.value;render()};
$("rg").onchange=()=>{pvSet.clear();render()};
$("pv").onclick=e=>{if(e.target.dataset&&e.target.dataset.clr){pvSet.clear();render()}};
$("pv").onchange=e=>{const c=e.target;if(c.type!=="checkbox")return;c.checked?pvSet.add(c.value):pvSet.delete(c.value);render()};
$("pvbtn").onclick=()=>{$("pv").hidden=!$("pv").hidden};
document.addEventListener("click",e=>{if(!e.composedPath().some(n=>n.id==="pvwrap"))$("pv").hidden=true});
$("onlylist").onchange=render;
$("refresh").onclick=()=>$("load").click();
$("sync").onclick=()=>$("load").click();
setInterval(()=>{if($("auto").checked&&!document.hidden)$("load").click()},300000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&$("auto").checked&&rows.length)$("load").click()});
$("load").click();
