<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>W&W · Ticket Follow-up</title>
<style>
:root{--bg:#070b1a;--card:rgba(18,26,52,.62);--tx:#e6f1ff;--mu:#7f93b8;--bd:rgba(80,140,255,.22);--ac:#22d3ee;--ac2:#d946ef;--ok:#34d399;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:14px/1.5 "Segoe UI",system-ui,"Noto Sans Thai",sans-serif;color:var(--tx);padding:20px;
  background:radial-gradient(900px 500px at 8% -10%,rgba(34,211,238,.18),transparent 60%),
             radial-gradient(800px 500px at 100% 0%,rgba(217,70,239,.16),transparent 60%),
             linear-gradient(180deg,#070b1a,#0a1030 60%,#060914);background-attachment:fixed}
.wrap{max-width:1000px;margin:auto}
h1{font-size:20px;margin:0 0 14px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;
  background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 10px rgba(34,211,238,.35))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 0 0 1px rgba(255,255,255,.02) inset,0 8px 32px rgba(0,0,0,.45)}
label{display:block;font-size:11px;color:var(--mu);margin-bottom:5px;letter-spacing:.05em;text-transform:uppercase}
input[type=text],textarea,select{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;background:rgba(5,9,24,.7);color:var(--tx);font:inherit;outline:none;transition:.15s}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(34,211,238,.18),0 0 14px rgba(34,211,238,.25)}
input[type=checkbox]{accent-color:var(--ac)}
textarea{min-height:60px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row>div{flex:1;min-width:180px}
button{padding:9px 16px;border:0;border-radius:8px;background:linear-gradient(90deg,var(--ac),#3b82f6);color:#04101f;font:inherit;font-weight:600;cursor:pointer;
  box-shadow:0 0 16px rgba(34,211,238,.35);transition:.15s}
button:hover{filter:brightness(1.12);box-shadow:0 0 22px rgba(34,211,238,.6)}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac);box-shadow:none}
button.sec.on{background:var(--ac);color:#04101f;box-shadow:0 0 14px rgba(34,211,238,.5)}
button.sec:hover{background:rgba(34,211,238,.12);box-shadow:0 0 14px rgba(34,211,238,.35)}
button.done{background:var(--ok);color:#04201a;border-color:var(--ok);box-shadow:0 0 18px rgba(52,211,153,.55)}
.site{border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;overflow:hidden;background:rgba(8,14,36,.45)}
.sh{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:rgba(34,211,238,.07);border-bottom:1px solid var(--bd)}
.sh b{font-size:15px}
.t{padding:6px 12px;border-top:1px solid rgba(80,140,255,.12);display:flex;gap:10px;font-size:13px}
.t code{white-space:nowrap;color:var(--ac);font-family:ui-monospace,Consolas,monospace}
.t span{color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mu{color:var(--mu);font-size:12px}
.sync{display:inline-flex;align-items:center;gap:9px;flex-wrap:wrap;padding:7px 14px;margin:0 0 14px;border:1px solid var(--bd);border-radius:999px;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:13px;cursor:pointer;user-select:none}
.sync i{width:10px;height:10px;border-radius:50%;background:var(--mu);flex:none}
.sync.ok i{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.sync.busy i{background:var(--ac);box-shadow:0 0 10px var(--ac);animation:pl 1s ease-in-out infinite}
.sync.err i{background:#f87171;box-shadow:0 0 10px #f87171}
.sync b{color:var(--tx)}
@keyframes pl{50%{opacity:.25}}
#count{color:var(--ac2);text-shadow:0 0 10px rgba(217,70,239,.5)}
#msg{margin-top:8px}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:rgba(34,211,238,.3);border-radius:8px}
</style>
</head>
<body>
<div class="wrap">
<h1>W&W · Ticket Follow-up</h1>
<div id="sync" class="sync" title="คลิกเพื่อ Sync ตอนนี้"><i></i><span><b>ยังไม่ได้ Sync</b></span></div>

<div class="card" style="display:none">
  <div class="row">
    <div style="flex:3"><label>ลิงก์ Google Sheet</label><input type="text" id="url" value="https://docs.google.com/spreadsheets/d/1TtEps-4CwrDe3P77LN_XEikTvO89DLdOenxL3fb0mZ4/edit?gid=338097387#gid=338097387"></div>
    <div style="flex:0;min-width:auto"><button id="load">โหลดข้อมูล</button></div>
    <div style="flex:0;min-width:auto"><button class="sec" onclick="file.click()">อัปโหลด CSV</button><input type="file" id="file" accept=".csv" hidden></div>
  </div>
  <div class="row" style="margin-top:10px;align-items:center">
    <div style="flex:0;min-width:auto"><button class="sec" id="refresh">รีเฟรชข้อมูล</button></div>
    <div style="flex:0;min-width:auto;white-space:nowrap"><label style="display:inline;color:var(--tx);text-transform:none"><input type="checkbox" id="auto" checked> รีเฟรชอัตโนมัติทุก 5 นาที</label></div>
    <div id="upd" style="flex:2" class="mu">ยังไม่มีข้อมูล</div>
  </div>
  <div class="mu" id="msg">ชีตต้องแชร์เป็น "ทุกคนที่มีลิงก์ดูได้" ถ้าโหลดไม่ได้ ให้ดาวน์โหลดเป็น CSV แล้วอัปโหลดแทน</div>
</div>

<div class="card" style="display:none">
  <label>วิธีสำรอง: ในชีตกด Ctrl+A → Ctrl+C แล้ววางที่นี่ (ต้องรวมแถวหัวคอลัมน์)</label>

  <div style="margin-top:6px"><button class="sec" id="usepaste">ใช้ข้อมูลที่วาง</button></div>
</div>

<div class="card">
  <div class="row">
    <div style="flex:1"><label>กรองจากคำใน Subject</label>
      <select id="kw"><option value="all">ทั้งหมด</option><option value="power">ระบบไฟ</option><option value="ofc">OFC</option></select></div>
    <div><label>Site</label><input type="text" id="sitef" placeholder="ค้นหา Site เช่น NKN"></div>
    <div><label>Severity</label>

    <div><label>Region</label><select id="rg"><option value="">ทั้งหมด</option><option>BMA</option><option>CW</option><option>East</option><option>South</option><option>อื่นๆ</option></select></div>
    <div style="flex:0;min-width:auto;white-space:nowrap"><label>&nbsp;</label><label style="display:inline;color:var(--tx)"><input type="checkbox" id="onlylist" checked> เฉพาะ Site ในรายการ</label></div>
    <div><label>Status</label><select id="stat"><option value="">ทั้งหมด</option></select></div>
  </div>
  <div class="mu" style="margin-top:6px">ระบบไฟ = Generator, Main, urgent · OFC = OFC (ไม่สนตัวพิมพ์เล็ก-ใหญ่)</div>
</div>

<div class="card">
  <div class="row" style="align-items:center">
    <div><b id="count">ยังไม่มีข้อมูล</b></div>
    <div style="flex:0;min-width:auto;white-space:nowrap">
      <button id="copyall">Copy ตามตัวกรอง</button>
    </div>
  </div>
  <div id="list" style="margin-top:10px"></div>
</div>
</div>

function setSync(state,title,detail){
  const el=document.getElementById("sync");
  el.className="sync "+state;
  el.innerHTML=`<i></i><span><b>${title}</b>${detail?` <span class="mu">· ${detail}</span>`:""}</span>`;
}
function setUpd(src){
  const n=new Date();
  const t=n.toLocaleTimeString("th-TH",{hour12:false});
  const d=n.toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"numeric"});
  $("upd").innerHTML=`<span style="color:var(--ok)">●</span> อัปเดตข้อมูลล่าสุดเมื่อ <b style="color:var(--tx)">${t}</b> · ${d} · จาก ${src}`;
  lastOk=`${t} · ${d}`;
  setSync("ok","Sync แล้ว ✓",`${t} · ${d} · จาก ${src}`);
}

const SMAP={};
for(const k in SG)SG[k].split(/\s+/).forEach(x=>{if(x){SMAP[x]=k;SMAP[x.split("(")[0]]=SMAP[x.split("(")[0]]||k}});
const siteKey=x=>{const n=x.site.toUpperCase().trim();return SMAP[n]?n:(SMAP[n.split("(")[0]]?n.split("(")[0]:null)};
const inList=x=>siteKey(x)!==null;
const grp=x=>{const k=siteKey(x);if(!k)return "อื่นๆ";const g=SMAP[k];return (g==="Central"||g==="West")?"CW":g};

const $=id=>document.getElementById(id);

function parseCSV(t,d=","){
  const out=[];let r=[],c="",q=false;
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(q){ if(ch=='"'){ if(t[i+1]=='"'){c+='"';i++} else q=false } else c+=ch }
    else if(ch=='"') q=true;
    else if(ch==d){r.push(c);c=""}
    else if(ch=='\n'||ch=='\r'){ if(ch=='\r'&&t[i+1]=='\n')i++; r.push(c);out.push(r);r=[];c="" }
    else c+=ch;
  }
  if(c||r.length){r.push(c);out.push(r)}
  return out;
}

function ingest(text,d,src="Google Sheet"){
  const keepStat=$("stat").value;
  const t=(Array.isArray(text)?text:parseCSV(text,d)).filter(r=>r.some(x=>String(x).trim()));
  const h=t[0].map(x=>String(x).trim().toUpperCase());
  const ix=n=>h.indexOf(n);
  const iS=ix("SITENAME"),iT=ix("TICKETID"),iJ=ix("SUBJECT"),iU=ix("STATUS"),iR=ix("REGION"),iV=ix("SEVERITY");
  if(iS<0||iT<0||iJ<0) throw new Error("ไม่พบหัวคอลัมน์ SITENAME / TICKETID / SUBJECT");
  rows=t.slice(1).map(r=>({site:(r[iS]||"").trim(),id:(r[iT]||"").trim(),subj:r[iJ]||"",stat:iU>=0?(r[iU]||"").trim():"",sev:iV>=0?String(r[iV]||"").trim().toUpperCase():"",region:iR>=0?String(r[iR]||"").trim().toUpperCase():""})).filter(x=>x.id);
  const st=[...new Set(rows.map(x=>x.stat).filter(Boolean))].sort();
  $("stat").innerHTML='<option value="">ทั้งหมด</option>'+st.map(s=>`<option>${s}</option>`).join("");
  if(st.includes(keepStat))$("stat").value=keepStat;
  setUpd(src);
  render();
}

const KW={
  power:"Generator|Mains?(?:fail|\\s*power|\\b)|urgent",
  ofc:"OFC"
};
let kwMode="all";
let sevSet=new Set(["NSA1","NSA2","NSA3"]);
function buildRegex(){
  if(kwMode==="all")return null;
  const src=kwMode==="both"?KW.power+"|"+KW.ofc:KW[kwMode];
  return new RegExp(src,"i");
}

const ORDER=["BMA","CW","East","South","อื่นๆ"];

function filtered(){
  const re=buildRegex(),sf=$("sitef").value.trim().toLowerCase(),st=$("stat").value,rg=$("rg").value,ol=$("onlylist").checked;
  return rows.filter(x=>(!ol||inList(x))&&(sevSet.size===0||sevSet.has(x.sev))&&(!re||re.test(x.subj))&&(!sf||x.site.toLowerCase().includes(sf))&&(!st||x.stat===st)&&(!rg||grp(x)===rg));
}

const SUF=" Site RN , PN , DN , CX , TOC , AGN , AN";
const HP="ติดตามขอ Update กลุ่มที่มีความเสี่ยงเรื่องระบบไฟฟ้า"+SUF;
const HO="ติดตามขอ Update กลุ่มที่มีความเสี่ยง Simplex กระทบการเกิด Ticket SA"+SUF;
const lines=l=>{
  const g=new Map();
  l.forEach(x=>{if(!g.has(x.site))g.set(x.site,[]);g.get(x.site).push(x.id)});
  return [...g].map(([site,ids])=>site+"\n"+ids.join("\n")).join("\n");
};
function text(items){
  if(kwMode==="power")return HP+"\n"+lines(items);
  if(kwMode==="ofc")return HO+"\n"+lines(items);
  if(kwMode==="both"){
    const rP=new RegExp(KW.power,"i"),rO=new RegExp(KW.ofc,"i");
    const p=items.filter(x=>rP.test(x.subj)),o=items.filter(x=>rO.test(x.subj));
    return [p.length?HP+"\n"+lines(p):"",o.length?HO+"\n"+lines(o):""].filter(Boolean).join("\n\n");
  }
  return "ติดตาม Update\n"+lines(items);
}

function render(){
  const list=filtered();
  const esc=v=>String(v).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  $("count").textContent=rows.length?`พบ ${list.length} Ticket`:"ยังไม่มีข้อมูล";
  $("list").innerHTML="";
  ORDER.forEach(rg=>{
    const items=list.filter(x=>grp(x)===rg);
    if(!items.length)return;
    const sec=document.createElement("div");
    sec.innerHTML=`<div class="sh" style="border-radius:8px;margin:12px 0 6px"><b>${rg} <span class="mu">(${items.length})</span></b><button>Copy ${rg}</button></div>`;
    sec.querySelector("button").onclick=e=>copy(text(items),e.target);
    const bySite={};items.forEach(x=>(bySite[x.site]=bySite[x.site]||[]).push(x));
    Object.keys(bySite).sort().forEach(site=>{
      const d=document.createElement("div");d.className="site";
      d.innerHTML=`<div class="sh"><b>${esc(site)} <span class="mu">${esc(bySite[site][0].region)} · ${bySite[site].length}</span></b><button class="sec">Copy</button></div>`+
        bySite[site].map(x=>`<div class="t"><code>${esc(x.id)}</code><span>${esc(x.subj)}</span></div>`).join("");
      d.querySelector("button").onclick=e=>copy(text(bySite[site]),e.target);
      sec.appendChild(d);
    });
    $("list").appendChild(sec);
  });
}

async function copy(txt,btn){
  try{await navigator.clipboard.writeText(txt)}
  catch{const a=document.createElement("textarea");a.value=txt;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}
  const o=btn.textContent;btn.textContent="คัดลอกแล้ว";btn.classList.add("done");
  setTimeout(()=>{btn.textContent=o;btn.classList.remove("done")},1200);
}

$("copyall").onclick=e=>copy(text(filtered()),e.target);

function viaScript(id,gid){
  return new Promise((res,rej)=>{
    window.google={visualization:{Query:{setResponse:r=>{
      if(!r||!r.table)return rej(new Error("ชีตไม่เปิดสิทธิ์ดู"));
      const cols=r.table.cols.map(c=>c.label||"");
      const data=r.table.rows.map(x=>x.c.map(c=>c?(c.f!=null?c.f:(c.v==null?"":c.v)):""));
      res(cols.some(Boolean)?[cols,...data]:data);
    }}}};
    const sc=document.createElement("script");
    sc.src=`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json${gid?"&gid="+gid:""}&_=${Date.now()}`;
    sc.onerror=()=>rej(new Error("โหลดไม่ได้"));
    document.head.appendChild(sc);
    setTimeout(()=>rej(new Error("หมดเวลา")),15000);
  });
}

$("load").onclick=async()=>{
  const u=$("url").value.trim();
  setSync("busy","กำลัง Sync…","");
  const fail=m=>setSync("err","Sync ไม่สำเร็จ",m+(lastOk?` · สำเร็จล่าสุด ${lastOk}`:""));
  const pm=u.match(/\/d\/e\/([\w-]+)/);
  if(pm){
    $("msg").textContent="กำลังโหลด...";
    try{
      const g=(u.match(/gid=(\d+)/)||[])[1];
      const res=await fetch(`https://docs.google.com/spreadsheets/d/e/${pm[1]}/pub?output=csv${g?"&gid="+g:""}&_=${Date.now()}`,{cache:"no-store"});
      if(!res.ok)throw new Error("HTTP "+res.status);
      ingest(await res.text());$("msg").textContent="โหลดสำเร็จ";
    }catch(e){$("msg").textContent="โหลดไม่สำเร็จ: "+e.message+" (ใช้ช่องวางข้อมูลแทนได้)";fail(e.message)}
    return;
  }
  const m=u.match(/\/d\/([\w-]+)/),gid=(u.match(/gid=(\d+)/)||[])[1];
  if(!m){$("msg").textContent="ลิงก์ไม่ถูกต้อง";fail("ลิงก์ไม่ถูกต้อง");return}
  $("msg").textContent="กำลังโหลด...";
  try{
    const res=await fetch(`https://docs.google.com/spreadsheets/d/${m[1]}/gviz/tq?tqx=out:csv${gid?"&gid="+gid:""}&_=${Date.now()}`,{cache:"no-store"});
    if(!res.ok)throw new Error("HTTP "+res.status);
    ingest(await res.text());
    $("msg").textContent="โหลดสำเร็จ";
  }catch(e1){
    try{ingest(await viaScript(m[1],gid));$("msg").textContent="โหลดสำเร็จ"}
    catch(e2){$("msg").textContent="โหลดอัตโนมัติไม่ได้ (ชีตน่าจะยังไม่เปิดแชร์) ให้ใช้ช่องวางข้อมูลด้านล่างแทน";fail("ชีตอาจยังไม่เปิดแชร์")}
  }
};

$("usepaste").onclick=()=>{
  try{ingest($("paste").value,"\t","ข้อมูลที่วาง");$("msg").textContent="ใช้ข้อมูลที่วางแล้ว"}
  catch(err){$("msg").textContent=err.message}
};

$("file").onchange=e=>{

};

$("sitef").oninput=render;
$("sev").onchange=e=>{const v=e.target.value;sevSet=v==="all"?new Set(["NSA1","NSA2","NSA3"]):new Set([v]);render()};
$("kw").onchange=e=>{kwMode=e.target.value;render()};

$("refresh").onclick=()=>$("load").click();

setInterval(()=>{if($("auto").checked&&!document.hidden)$("load").click()},300000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&$("auto").checked&&rows.length)$("load").click()});
$("load").click();
